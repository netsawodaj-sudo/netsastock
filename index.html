<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NetsaStock - Modern Inventory Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --surface: #ffffff;
      --text: #111827;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Auth Screen */
    .auth-wrapper { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
    .auth-card { background: var(--surface); padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    .auth-card h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; text-align: center; color: var(--primary); }
    .auth-card p { color: var(--text-muted); font-size: 0.875rem; text-align: center; margin-bottom: 1.5rem; }

    /* Forms & Inputs */
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.375rem; color: #374151; }
    input { width: 100%; padding: 0.625rem 0.875rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; transition: all 0.2s; }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
    
    .btn { width: 100%; background: var(--primary); color: white; border: none; padding: 0.625rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 0.95rem; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #9ca3af; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #dc2626; }

    .toggle-auth { text-align: center; margin-top: 1rem; font-size: 0.875rem; color: var(--text-muted); }
    .toggle-auth a { color: var(--primary); font-weight: 600; text-decoration: none; cursor: pointer; }

    /* Dashboard Layout */
    .dashboard { display: none; max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; background: var(--surface); padding: 1rem 1.5rem; border-radius: 10px; border: 1px solid var(--border); }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--surface); padding: 1.25rem; border-radius: 10px; border: 1px solid var(--border); }
    .stat-card span { font-size: 0.875rem; color: var(--text-muted); }
    .stat-card h3 { font-size: 1.5rem; font-weight: 700; margin-top: 0.25rem; }

    .main-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    @media (min-width: 768px) { .main-grid { grid-template-columns: 320px 1fr; } }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; }
    .card h3 { font-size: 1.1rem; margin-bottom: 1rem; font-weight: 600; }

    /* Table */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { background: #f9fafb; color: var(--text-muted); padding: 0.75rem 1rem; font-weight: 600; border-bottom: 1px solid var(--border); }
    td { padding: 0.875rem 1rem; border-bottom: 1px solid var(--border); }
    
    .badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge-ok { background: #d1fae5; color: #065f46; }
    .badge-low { background: #fee2e2; color: #991b1b; }

    .actions { display: flex; gap: 0.5rem; }
    .actions button { padding: 0.35rem 0.65rem; font-size: 0.8rem; width: auto; }
  </style>
</head>
<body>

  <!-- AUTH SECTION -->
  <div id="auth-section" class="auth-wrapper">
    <div class="auth-card">
      <h2 id="auth-title">NetsaStock Login</h2>
      <p id="auth-subtitle">Sign in to manage your inventory</p>
      
      <form id="auth-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="auth-email" required placeholder="owner@netsastock.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="auth-password" required placeholder="••••••••" />
        </div>
        <button type="submit" id="auth-btn" class="btn">Sign In</button>
      </form>

      <div class="toggle-auth">
        <span id="toggle-text">Need an account?</span> 
        <a id="toggle-btn">Sign Up</a>
      </div>
    </div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboard-section" class="dashboard">
    <header>
      <div>
        <h1 style="color: var(--primary); font-size: 1.5rem;">NetsaStock</h1>
        <p id="user-display" style="font-size: 0.85rem; color: var(--text-muted);"></p>
      </div>
      <button id="logout-btn" class="btn btn-secondary" style="width: auto;">Sign Out</button>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <span>Total Items</span>
        <h3 id="total-items">0</h3>
      </div>
      <div class="stat-card">
        <span>Total Value</span>
        <h3 id="total-value">$0.00</h3>
      </div>
      <div class="stat-card">
        <span>Low Stock Alerts</span>
        <h3 id="low-stock-count" style="color: var(--danger);">0</h3>
      </div>
    </div>

    <div class="main-grid">
      <!-- Add/Edit Form -->
      <div class="card">
        <h3 id="form-title">Add New Stock</h3>
        <form id="item-form">
          <input type="hidden" id="item-id" />
          <div class="form-group">
            <label>Item Name</label>
            <input type="text" id="name" required placeholder="e.g. Sugar (25kg)" />
          </div>
          <div class="form-group">
            <label>Quantity</label>
            <input type="number" id="quantity" required min="0" placeholder="0" />
          </div>
          <div class="form-group">
            <label>Price</label>
            <input type="number" id="price" required step="0.01" min="0" placeholder="0.00" />
          </div>
          <button type="submit" id="submit-btn" class="btn">Add Item</button>
          <button type="button" id="cancel-btn" class="btn btn-secondary" style="display: none; margin-top: 0.5rem;">Cancel</button>
        </form>
      </div>

      <!-- Inventory Table -->
      <div class="card table-container">
        <h3>Current Inventory</h3>
        <table>
          <thead>
            <tr>
              <th>Item</th>
              <th>Qty</th>
              <th>Price</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="inventory-list">
            <tr><td colspan="4" style="text-align: center;">Loading stock...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      doc, 
      updateDoc, 
      deleteDoc,
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDKSJJILpEweO7DzCbr3l4hmZxNHa6DaRg",
      authDomain: "netsastock.firebaseapp.com",
      projectId: "netsastock",
      storageBucket: "netsastock.firebasestorage.app",
      messagingSenderId: "607024310954",
      appId: "1:607024310954:web:ca54c8f700307c5275fed3",
      measurementId: "G-C08F0PHZK4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const stockCollection = collection(db, "inventory");

    // UI Elements
    const authSection = document.getElementById("auth-section");
    const dashboardSection = document.getElementById("dashboard-section");
    const authForm = document.getElementById("auth-form");
    const authTitle = document.getElementById("auth-title");
    const authSubtitle = document.getElementById("auth-subtitle");
    const authBtn = document.getElementById("auth-btn");
    const toggleBtn = document.getElementById("toggle-btn");
    const toggleText = document.getElementById("toggle-text");
    const userDisplay = document.getElementById("user-display");
    const logoutBtn = document.getElementById("logout-btn");

    let isSignUp = false;

    // Toggle Login / Sign Up UI
    toggleBtn.addEventListener("click", () => {
      isSignUp = !isSignUp;
      if (isSignUp) {
        authTitle.textContent = "Create Account";
        authSubtitle.textContent = "Sign up to manage your store";
        authBtn.textContent = "Sign Up";
        toggleText.textContent = "Already have an account?";
        toggleBtn.textContent = "Sign In";
      } else {
        authTitle.textContent = "NetsaStock Login";
        authSubtitle.textContent = "Sign in to manage your inventory";
        authBtn.textContent = "Sign In";
        toggleText.textContent = "Need an account?";
        toggleBtn.textContent = "Sign Up";
      }
    });

    // Handle Authentication
    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("auth-email").value;
      const password = document.getElementById("auth-password").value;

      try {
        if (isSignUp) {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (error) {
        alert(error.message);
      }
    });

    logoutBtn.addEventListener("click", () => signOut(auth));

    // Auth State Observer
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authSection.style.display = "none";
        dashboardSection.style.display = "block";
        userDisplay.textContent = `Logged in as: ${user.email}`;
        loadInventory();
      } else {
        authSection.style.display = "flex";
        dashboardSection.style.display = "none";
      }
    });

    // Load & Render Inventory
    function loadInventory() {
      onSnapshot(stockCollection, (snapshot) => {
        const list = document.getElementById("inventory-list");
        list.innerHTML = "";
        
        let count = 0;
        let totalVal = 0;
        let lowStockCount = 0;

        if (snapshot.empty) {
          list.innerHTML = `<tr><td colspan="4" style="text-align: center;">No items found.</td></tr>`;
        }

        snapshot.forEach((doc) => {
          const item = doc.data();
          const id = doc.id;
          const isLow = item.quantity < 5;

          count += 1;
          totalVal += item.quantity * item.price;
          if (isLow) lowStockCount += 1;

          const row = document.createElement("tr");
          row.innerHTML = `
            <td><strong>${item.name}</strong></td>
            <td><span class="badge ${isLow ? 'badge-low' : 'badge-ok'}">${item.quantity}</span></td>
            <td>$${Number(item.price).toFixed(2)}</td>
            <td class="actions">
              <button class="btn" onclick="editItem('${id}', '${item.name.replace(/'/g, "\\'")}', ${item.quantity}, ${item.price})">Edit</button>
              <button class="btn btn-danger" onclick="removeItem('${id}')">Delete</button>
            </td>
          `;
          list.appendChild(row);
        });

        document.getElementById("total-items").textContent = count;
        document.getElementById("total-value").textContent = `$${totalVal.toFixed(2)}`;
        document.getElementById("low-stock-count").textContent = lowStockCount;
      });
    }

    // Form Handling
    const form = document.getElementById("item-form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("item-id").value;
      const data = {
        name: document.getElementById("name").value,
        quantity: parseInt(document.getElementById("quantity").value, 10),
        price: parseFloat(document.getElementById("price").value),
        updatedAt: serverTimestamp()
      };

      if (id) {
        await updateDoc(doc(db, "inventory", id), data);
      } else {
        await addDoc(stockCollection, data);
      }
      resetForm();
    });

    window.editItem = (id, name, quantity, price) => {
      document.getElementById("item-id").value = id;
      document.getElementById("name").value = name;
      document.getElementById("quantity").value = quantity;
      document.getElementById("price").value = price;
      document.getElementById("form-title").textContent = "Edit Item";
      document.getElementById("submit-btn").textContent = "Update Item";
      document.getElementById("cancel-btn").style.display = "block";
    };

    window.removeItem = async (id) => {
      if (confirm("Delete this item?")) {
        await deleteDoc(doc(db, "inventory", id));
      }
    };

    document.getElementById("cancel-btn").addEventListener("click", resetForm);

    function resetForm() {
      form.reset();
      document.getElementById("item-id").value = "";
      document.getElementById("form-title").textContent = "Add New Stock";
      document.getElementById("submit-btn").textContent = "Add Item";
      document.getElementById("cancel-btn").style.display = "none";
    }
  </script>
</body>
</html>
